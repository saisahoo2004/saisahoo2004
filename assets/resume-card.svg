<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="760" height="170" role="img" aria-label="Open my resume">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1a14"/>
      <stop offset="1" stop-color="#0b2a3a"/>
    </linearGradient>
    <pattern id="rgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#17483f" stroke-width="0.5"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'Fira Code', Consolas, 'Courier New', monospace; }
    .blink { animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  </style>

  <rect x="2" y="2" width="756" height="166" rx="16" fill="url(#rbg)" stroke="#2dffb3" stroke-width="2"/>
  <rect x="2" y="2" width="756" height="166" rx="16" fill="url(#rgrid)" opacity="0.6"/>

  <!-- document icon -->
  <g transform="translate(42 32)">
    <path d="M0 0H62L88 26V106H0Z" fill="#0d2230" stroke="#00e5ff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M62 0V26H88" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#2dffb3" stroke-width="4" stroke-linecap="round">
      <path d="M16 46H72"/><path d="M16 62H72"/><path d="M16 78H52"/>
    </g>
    <rect x="16" y="14" width="22" height="22" rx="3" fill="none" stroke="#ffb020" stroke-width="2.5"/>
    <path d="M22 14V8M27 14V8M32 14V8" stroke="#ffb020" stroke-width="2"/>
  </g>

  <!-- text -->
  <text x="160" y="72" class="mono" font-size="34" font-weight="700" fill="#ffffff">VIEW MY RESUME</text>
  <text x="160" y="102" class="mono" font-size="16" fill="#7df3ff">Naga Venkata Sai Chejarla</text>
  <text x="160" y="126" class="mono" font-size="14" fill="#a9bddb">VLSI Design &amp; Verification  |  RTL  |  Verilog  |  UVM</text>

  <!-- open button -->
  <g class="blink">
    <rect x="590" y="62" width="136" height="46" rx="23" fill="#2dffb3"/>
    <text x="658" y="92" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#06201a">OPEN PDF →</text>
  </g>
</svg>
